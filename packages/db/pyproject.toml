[project]
name = "relearn-db"
version = "0.1.0"
description = "Relearn shared Postgres schema: SQLAlchemy models + Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relearn_db"]
