[project]
name = "relearn-backend"
version = "0.1.0"
description = "Relearn backend gateway: auth, spaces, resources, upload, SSE proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "relearn-db",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv.sources]
relearn-db = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# one shared event loop for the whole session: the gateway's module-level engine
# is created once (as in production), so asyncpg connections stay on one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relearn_backend"]
