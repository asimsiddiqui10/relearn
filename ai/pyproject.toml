[project]
name = "relearn-ai"
version = "0.1.0"
description = "Relearn AI service: agent runtime + ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "relearn-db",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "openai>=1.40",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
embeddings = [
    "FlagEmbedding>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv.sources]
relearn-db = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relearn_ai"]
