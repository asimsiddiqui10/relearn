name: relearn

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relearn}
      POSTGRES_DB: ${POSTGRES_DB:-relearn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relearn} -d ${POSTGRES_DB:-relearn}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-relearn}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-relearn-dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-relearn} ${MINIO_ROOT_PASSWORD:-relearn-dev} &&
      mc mb --ignore-existing local/${S3_BUCKET:-relearn} &&
      exit 0
      "
# Persistence: postgres/redis/minio bind-mount to ./.data on the host, so data
# survives `docker compose down` — even `down -v`. The parse cache (.data/minio)
# and the raw/parsed mirror (.data/corpus, via LOCAL_CACHE_DIR) live on disk;
# Datalab is paid at most once per unique file, ever.
